name: verify

# Mirrors scripts\verify.bat so the same five checks run locally and in CI.
# The race detector only actually runs here: it needs cgo, and the Linux
# runner below has a C toolchain. Locally the guard skips it when no C
# compiler is present, which is why the watchdog/guardian/transport
# goroutines have gone un-race-checked until now.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancels superseded runs on the same ref - a series of pushes to main
# should not queue five identical Go builds.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: agent (vet, cross-compile, test, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: go vet
        working-directory: agent
        run: go vet ./...

      # helpers_windows.go and helpers_linux.go implement the same surface
      # for two platforms and drift silently. Building only the host OS
      # looks green while breaking the other target, so build both.
      - name: build (windows)
        working-directory: agent
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

      - name: build (linux)
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build ./...

      # darwin is deliberately NOT built: agent/service has no darwin files
      # and `go build` fails on it with "build constraints exclude all Go
      # files". The agent ships as a Windows service or a Linux daemon.

      - name: test
        working-directory: agent
        run: go test ./...

      - name: test -race
        working-directory: agent
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  dashboard:
    name: dashboard (test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: install
        working-directory: dashboard
        run: npm ci

      # Glob-scoped on purpose: `node --test server/` executes every .js
      # file in the directory, which imports server/index.js and starts the
      # real dashboard (binds :8443, opens the WS hub, connects to
      # Postgres) and then never exits. See the note in README.md.
      - name: test
        working-directory: dashboard
        run: npm test

      - name: build
        working-directory: dashboard
        run: npm run build

  e2e:
    name: dashboard e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: install
        working-directory: dashboard
        run: npm ci

      - name: install browsers
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      # Fully mocked: every test installs /api/* routes, so no Postgres, no
      # TLS cert and nothing on :8443 is needed.
      - name: e2e
        working-directory: dashboard
        run: npm run test:e2e

      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7