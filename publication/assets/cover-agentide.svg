<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">AgentIde cover illustration</title>
  <desc id="cover-desc">An assessment console lists eight technique modules with pass and fail results, connected by a scan line to a pixel-art shield representing an endpoint security product under test.</desc>

  <rect width="1600" height="900" fill="#F4F2EC"/>

  <!-- kicker -->
  <text x="88" y="126" font-family="Consolas, 'Courier New', monospace" font-size="22" letter-spacing="6" fill="#6B6B66">EDR / XDR ASSESSMENT</text>
  <rect x="88" y="148" width="132" height="8" fill="#B45309"/>

  <!-- terminal window -->
  <rect x="100" y="252" width="640" height="456" fill="#141414"/>
  <rect x="88" y="240" width="640" height="456" fill="#FAFAF7" stroke="#141414" stroke-width="8"/>
  <rect x="88" y="240" width="640" height="56" fill="#141414"/>
  <rect x="112" y="259" width="18" height="18" fill="#B45309"/>
  <rect x="142" y="259" width="18" height="18" fill="#6B6B66"/>
  <rect x="172" y="259" width="18" height="18" fill="#6B6B66"/>
  <text x="220" y="279" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="3" fill="#F4F2EC">module run / blackbox</text>

  <!-- module rows -->
  <text x="112" y="336" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#141414">performance</text>
  <rect x="548" y="316" width="150" height="30" fill="#B45309"/>
  <text x="566" y="338" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="1" fill="#FFFFFF">TIMEOUT</text>
  <rect x="108" y="356" width="592" height="1" fill="#DCDAD2"/>

  <text x="112" y="380" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#141414">malware</text>
  <rect x="548" y="360" width="150" height="30" fill="#B91C1C"/>
  <text x="594" y="382" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="1" fill="#FFFFFF">FAIL</text>
  <rect x="108" y="400" width="592" height="1" fill="#DCDAD2"/>

  <text x="112" y="424" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#141414">lolbin</text>
  <rect x="548" y="404" width="150" height="30" fill="#15803D"/>
  <text x="594" y="426" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="1" fill="#FFFFFF">PASS</text>
  <rect x="108" y="444" width="592" height="1" fill="#DCDAD2"/>

  <text x="112" y="468" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#141414">network</text>
  <rect x="548" y="448" width="150" height="30" fill="#15803D"/>
  <text x="594" y="470" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="1" fill="#FFFFFF">PASS</text>
  <rect x="108" y="488" width="592" height="1" fill="#DCDAD2"/>

  <text x="112" y="512" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#141414">identity</text>
  <rect x="548" y="492" width="150" height="30" fill="#15803D"/>
  <text x="594" y="514" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="1" fill="#FFFFFF">PASS</text>
  <rect x="108" y="532" width="592" height="1" fill="#DCDAD2"/>

  <text x="112" y="556" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#141414">antitamper</text>
  <rect x="548" y="536" width="150" height="30" fill="#15803D"/>
  <text x="594" y="558" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="1" fill="#FFFFFF">PASS</text>
  <rect x="108" y="576" width="592" height="1" fill="#DCDAD2"/>

  <text x="112" y="600" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#141414">falsepositive</text>
  <rect x="548" y="580" width="150" height="30" fill="#15803D"/>
  <text x="594" y="602" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="1" fill="#FFFFFF">PASS</text>
  <rect x="108" y="620" width="592" height="1" fill="#DCDAD2"/>

  <text x="112" y="644" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#141414">reboot</text>
  <rect x="548" y="624" width="150" height="30" fill="#B91C1C"/>
  <text x="594" y="646" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="1" fill="#FFFFFF">FAIL</text>

  <!-- score strip -->
  <text x="112" y="688" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#141414">5 / 8 PASSED &#8212; 62.5%</text>
  <rect x="420" y="674" width="28" height="18" fill="#15803D"/>
  <rect x="456" y="674" width="28" height="18" fill="#15803D"/>
  <rect x="492" y="674" width="28" height="18" fill="#15803D"/>
  <rect x="528" y="674" width="28" height="18" fill="#15803D"/>
  <rect x="564" y="674" width="28" height="18" fill="#15803D"/>
  <rect x="600" y="674" width="28" height="18" fill="#B45309"/>
  <rect x="636" y="674" width="28" height="18" fill="#B91C1C"/>
  <rect x="672" y="674" width="28" height="18" fill="#B91C1C"/>

  <!-- scan path -->
  <path d="M742 470 H930" stroke="#141414" stroke-width="6" stroke-dasharray="12 12" fill="none"/>
  <polygon points="930,456 962,470 930,484" fill="#141414"/>

  <!-- scattered assessment modules -->
  <rect x="762" y="300" width="28" height="28" fill="#B45309"/>
  <rect x="820" y="344" width="18" height="18" fill="#141414"/>
  <rect x="756" y="520" width="30" height="30" fill="#F59E0B"/>
  <rect x="842" y="540" width="16" height="16" fill="#141414"/>
  <rect x="796" y="596" width="24" height="24" fill="#D9D7CE" stroke="#141414" stroke-width="5"/>

  <!-- reticle -->
  <path d="M980 240 V170 H1050" stroke="#141414" stroke-width="8" fill="none"/>
  <path d="M1420 240 V170 H1350" stroke="#141414" stroke-width="8" fill="none"/>
  <path d="M980 690 V760 H1050" stroke="#141414" stroke-width="8" fill="none"/>
  <path d="M1420 690 V760 H1350" stroke="#141414" stroke-width="8" fill="none"/>
  <path d="M1200 150 V790" stroke="#141414" stroke-width="3" stroke-dasharray="12 14" opacity="0.28" fill="none"/>
  <path d="M950 466 H1450" stroke="#141414" stroke-width="3" stroke-dasharray="12 14" opacity="0.28" fill="none"/>

  <!-- pixel shield -->
  <rect x="1060" y="240" width="280" height="160" fill="#B45309"/>
  <rect x="1080" y="400" width="240" height="100" fill="#B45309"/>
  <rect x="1100" y="500" width="200" height="60" fill="#B45309"/>
  <rect x="1130" y="560" width="140" height="50" fill="#B45309"/>
  <rect x="1165" y="610" width="70" height="30" fill="#B45309"/>

  <rect x="1084" y="264" width="232" height="136" fill="#141414"/>
  <rect x="1104" y="400" width="192" height="100" fill="#141414"/>
  <rect x="1124" y="500" width="152" height="60" fill="#141414"/>
  <rect x="1148" y="560" width="104" height="50" fill="#141414"/>

  <rect x="1076" y="256" width="14" height="14" fill="#F59E0B"/>
  <rect x="1310" y="256" width="14" height="14" fill="#F59E0B"/>

  <rect x="1186" y="356" width="28" height="28" fill="#F59E0B"/>
  <rect x="1192" y="384" width="16" height="46" fill="#F59E0B"/>

  <!-- base rule -->
  <rect x="88" y="812" width="1424" height="8" fill="#141414"/>
  <rect x="88" y="786" width="40" height="40" fill="#B45309"/>
  <text x="1512" y="858" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="4" fill="#6B6B66">AGENTIDE // ASSESSMENT INSTRUMENT</text>
</svg>
