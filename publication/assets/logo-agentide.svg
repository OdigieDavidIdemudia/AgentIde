<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -0.5 17 17" width="512" height="512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">AgentIde mark</title>
  <desc id="logo-desc">A mint square tile with a chunky black pixel letter A and an amber status pixel in the lower-right corner.</desc>

  <rect x="0" y="0" width="16" height="16" fill="#00D4AA" stroke="#141414" stroke-width="1" shape-rendering="crispEdges"/>

  <!-- block letter A -->
  <g fill="#141414" shape-rendering="crispEdges">
    <rect x="5" y="2" width="5" height="1"/>
    <rect x="4" y="3" width="2" height="1"/><rect x="9" y="3" width="2" height="1"/>
    <rect x="3" y="4" width="2" height="1"/><rect x="10" y="4" width="2" height="1"/>
    <rect x="3" y="5" width="2" height="1"/><rect x="10" y="5" width="2" height="1"/>
    <rect x="3" y="6" width="9" height="1"/>
    <rect x="3" y="7" width="2" height="1"/><rect x="10" y="7" width="2" height="1"/>
    <rect x="3" y="8" width="2" height="1"/><rect x="10" y="8" width="2" height="1"/>
    <rect x="3" y="9" width="2" height="1"/><rect x="10" y="9" width="2" height="1"/>
    <rect x="3" y="10" width="2" height="1"/><rect x="10" y="10" width="2" height="1"/>
    <rect x="3" y="11" width="2" height="1"/><rect x="10" y="11" width="2" height="1"/>
  </g>

  <!-- amber status pixel -->
  <rect x="13" y="13" width="2" height="2" fill="#F5A623" shape-rendering="crispEdges"/>
</svg>
